<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>电子证书领取</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 10px; font-size: 24px; }
        p.sub { color: #666; margin-bottom: 25px; font-size: 14px; }
        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #667eea; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:active { transform: scale(0.98); }
        .result { margin-top: 25px; display: none; }
        .result img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            border: 1px solid #eee;
        }
        .tip { margin-top: 15px; color: #888; font-size: 13px; line-height: 1.6; }
        .loading { display: none; color: #667eea; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>电子证书领取</h2>
        <p class="sub">请输入您在问卷中填写的姓名</p>
        <input type="text" id="userName" placeholder="请输入姓名" maxlength="12" autocomplete="off">
        <button onclick="makeCert()">生成我的证书</button>
        <div class="loading" id="loading">正在生成证书，请稍候...</div>
        <div class="result" id="result">
            <canvas id="certCanvas" style="display:none;"></canvas>
            <img id="certImg" alt="电子证书">
            <div class="tip">长按上方图片保存到相册<br>或点击右上角“···”分享给好友</div>
        </div>
    </div>
<script>
function makeCert() {
    const name = document.getElementById('userName').value.trim();
    if (!name) { alert('请输入姓名'); return; }
    document.getElementById('loading').style.display = 'block';
    document.getElementById('result').style.display = 'none';
    const canvas = document.getElementById('certCanvas');
    const ctx = canvas.getContext('2d');
    const bgImg = new Image();
    canvas.width = 1200; canvas.height = 848;
    bgImg.onload = function() {
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        ctx.font = 'bold 80px "Microsoft YaHei", "PingFang SC", sans-serif';
        ctx.fillStyle = '#2c3e50';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(name, canvas.width / 2, 420);
        const today = new Date();
        const dateStr = today.getFullYear() + '年' + (today.getMonth()+1) + '月' + today.getDate() + '日';
        ctx.font = '28px "Microsoft YaHei", sans-serif';
        ctx.fillStyle = '#555';
        ctx.fillText(dateStr, canvas.width / 2, 620);
        document.getElementById('certImg').src = canvas.toDataURL('image/png');
        document.getElementById('loading').style.display = 'none';
        document.getElementById('result').style.display = 'block';
    };
    bgImg.onerror = function() {
        ctx.fillStyle = '#f8f6f1'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 16;
        ctx.strokeRect(30, 30, 1140, 788);
        ctx.font = 'bold 72px "Microsoft YaHei", sans-serif';
        ctx.fillStyle = '#c9a227'; ctx.textAlign = 'center';
        ctx.fillText('结 业 证 书', canvas.width / 2, 200);
        ctx.font = '40px "Microsoft YaHei", sans-serif'; ctx.fillStyle = '#333';
        ctx.fillText('兹证明', canvas.width / 2, 320);
        ctx.font = 'bold 90px "Microsoft YaHei", sans-serif'; ctx.fillStyle = '#c9a227';
        ctx.fillText(name, canvas.width / 2, 460);
        ctx.font = '36px "Microsoft YaHei", sans-serif'; ctx.fillStyle = '#333';
        ctx.fillText('已完成本次学习，成绩合格，特发此证。', canvas.width / 2, 580);
        const today = new Date();
        const dateStr = today.getFullYear() + '年' + (today.getMonth()+1) + '月' + today.getDate() + '日';
        ctx.font = '30px "Microsoft YaHei", sans-serif'; ctx.fillStyle = '#666';
        ctx.fillText(dateStr, canvas.width / 2, 720);
        document.getElementById('certImg').src = canvas.toDataURL('image/png');
        document.getElementById('loading').style.display = 'none';
        document.getElementById('result').style.display = 'block';
    };
    bgImg.src = 'bg.jpg';
}
</script>
</body>
</html>
