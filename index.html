<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>合规测评证书领取</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h2 { color: #1e3c72; margin-bottom: 10px; font-size: 24px; }
        p.sub { color: #666; margin-bottom: 25px; font-size: 14px; }
        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus { border-color: #1e3c72; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:active { transform: scale(0.98); }
        .result { margin-top: 25px; display: none; }
        .result img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            border: 1px solid #eee;
        }
        .tip { margin-top: 15px; color: #888; font-size: 13px; line-height: 1.6; }
        .loading { display: none; color: #1e3c72; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>合规测评证书领取</h2>
        <p class="sub">请输入贵公司名称</p>
        <input type="text" id="userName" placeholder="请输入贵公司名称" maxlength="30" autocomplete="off">
        <button onclick="makeCert()">生成证书</button>
        <div class="loading" id="loading">正在生成证书，请稍候...</div>
        <div class="result" id="result">
            <canvas id="certCanvas" style="display:none;"></canvas>
            <img id="certImg" alt="合规测评证书">
            <div class="tip">长按上方图片保存到相册<br>或点击右上角“···”分享给好友</div>
        </div>
    </div>
<script>
function makeCert() {
    const name = document.getElementById('userName').value.trim();
    if (!name) { alert('请输入公司名称'); return; }
    document.getElementById('loading').style.display = 'block';
    document.getElementById('result').style.display = 'none';
    const canvas = document.getElementById('certCanvas');
    const ctx = canvas.getContext('2d');
    const bgImg = new Image();
    canvas.width = 1200; canvas.height = 848;
    
    bgImg.onload = function() {
        ctx.drawImage(bgImg, 0, 0, canvas.width, canvas.height);
        
        ctx.font = 'bold 52px "Microsoft YaHei", "PingFang SC", sans-serif';
        ctx.fillStyle = '#8B0000';
        ctx.textAlign = 'center';
        ctx.fillText('企业安全生产与环境保护合规测评', canvas.width / 2, 180);
        
        ctx.font = 'bold 40px "Microsoft YaHei", sans-serif';
        ctx.fillStyle = '#333';
        ctx.fillText('完 成 证 书', canvas.width / 2, 240);
        
        ctx.strokeStyle = '#8B0000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(400, 270);
        ctx.lineTo(800, 270);
        ctx.stroke();
        
        ctx.font = '32px "Microsoft YaHei", sans-serif';
        ctx.fillStyle = '#333';
        ctx.fillText('兹证明', canvas.width / 2, 340);
        
        ctx.font = 'bold 72px "Microsoft YaHei", "PingFang SC", sans-serif';
        ctx.fillStyle = '#1e3c72';
        ctx.fillText(name, canvas.width / 2, 440);
        
        ctx.font = '32px "Microsoft YaHei", sans-serif';
        ctx.fillStyle = '#333';
        ctx.fillText('已完成企业安全生产与环境保护合规测评。', canvas.width / 2, 540);
        
        const today = new Date();
        const dateStr = today.getFullYear() + '年' + (today.getMonth()+1) + '月' + today.getDate() + '日';
        ctx.font = '26px "Microsoft YaHei", sans-serif';
        ctx.fillStyle = '#555';
        ctx.textAlign = 'right';
        ctx.fillText(dateStr, 1100, 640);
        
        ctx.font = '28px "Microsoft YaHei", sans-serif';
        ctx.fillStyle = '#333';
        ctx.fillText('荆州市企业合规研究中心', 1100, 690);
        ctx.fillText('荆州市秉智合规公司', 1100, 730);
        
        document.getElementById('certImg').src = canvas.toDataURL('image/png');
        document.getElementById('loading').style.display = 'none';
        document.getElementById('result').style.display = 'block';
    };
    
    bgImg.onerror = function() {
        ctx.fillStyle = '#faf8f3';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.strokeStyle = '#8B0000';
        ctx.lineWidth = 12;
        ctx.strokeRect(25, 25, 1150, 798);
        ctx.strokeStyle = '#c9a227';
        ctx.lineWidth = 3;
        ctx.strokeRect(40, 40, 1120, 768);
        
        ctx.font = 'bold 52px "Microsoft YaHei", "PingFang SC", sans-serif';
        ctx.fillStyle = '#8B0000';
        ctx.textAlign = 'center';
        ctx.fillText('企业安全生产与环境保护合规测评', canvas.width / 2, 160);
        
        ctx.font = 'bold 40px "Microsoft YaHei", sans-serif';
        ctx.fillStyle = '#333';
        ctx.fillText('完 成 证 书', canvas.width / 2, 220);
        
        ctx.strokeStyle = '#8B0000';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(400, 250);
        ctx.lineTo(800, 250);
        ctx.stroke();
        
        ctx.font = '32px "Microsoft YaHei", sans-serif';
        ctx.fillStyle = '#333';
        ctx.fillText('兹证明', canvas.width / 2, 330);
        
        ctx.font = 'bold 72px "Microsoft YaHei", "PingFang SC", sans-serif';
        ctx.fillStyle = '#1e3c72';
        ctx.fillText(name, canvas.width / 2, 430);
        
        ctx.font = '32px "Microsoft YaHei", sans-serif';
        ctx.fillStyle = '#333';
        ctx.fillText('已完成企业安全生产与环境保护合规测评。', canvas.width / 2, 530);
        
        const today = new Date();
        const dateStr = today.getFullYear() + '年' + (today.getMonth()+1) + '月' + today.getDate() + '日';
        ctx.font = '26px "Microsoft YaHei", sans-serif';
        ctx.fillStyle = '#555';
        ctx.textAlign = 'right';
        ctx.fillText(dateStr, 1100, 640);
        
        ctx.font = '28px "Microsoft YaHei", sans-serif';
        ctx.fillStyle = '#333';
        ctx.fillText('荆州市企业合规研究中心', 1100, 690);
        ctx.fillText('荆州市秉智合规公司', 1100, 730);
        
        document.getElementById('certImg').src = canvas.toDataURL('image/png');
        document.getElementById('loading').style.display = 'none';
        document.getElementById('result').style.display = 'block';
    };
    
    bgImg.src = 'bg.jpg';
}
</script>
</body>
</html>
